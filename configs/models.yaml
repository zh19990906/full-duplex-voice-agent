model_root: ./models

asr:
  provider: whisper
  model_id: example/whisper-asr
  local_path: ./models/asr
  device: cuda

llm:
  provider: local
  model_id: example/llm-model
  local_path: ./models/llm
  device: cuda

tts:
  provider: modelscope
  model_id: example/tts-model
  local_path: ./models/tts
  device: cpu

translation:
  provider: huggingface
  model_id: example/translation-model
  local_path: ./models/translation
  device: cpu
