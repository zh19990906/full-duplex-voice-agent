model_root: ./models

asr:
  provider: whisper
  model_id: faster-whisper-large-v3
  local_path: ./models/asr
  device: cuda
  auto_load: true

llm:
  provider: llama_cpp
  model_id: Qwen/Qwen2.5-14B-Instruct
  local_path: ./models/llm
  device: cuda
  auto_load: true

policy:
  provider: local
  model_id: Qwen/Qwen2.5-1.5B-Instruct
  local_path: ./models/policy
  device: cuda
  auto_load: false

tts:
  provider: cosyvoice
  model_id: FunAudioLLM/CosyVoice3-0.5B
  local_path: ./models/tts
  device: cuda
  auto_load: false

translation:
  provider: huggingface
  model_id: Qwen/Qwen2.5-14B-Instruct
  local_path: ./models/translation
  device: cuda
  auto_load: false
